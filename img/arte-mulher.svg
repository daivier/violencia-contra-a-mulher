    <linearGradient id="blusa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2556f"/>
      <stop offset="1" stop-color="#b93a55"/>
    </linearGradient>
    <radialGradient id="hematoma" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6a2f7d" stop-opacity=".75"/>
      <stop offset=".6" stop-color="#8a3f86" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8a3f86" stop-opacity="0"/>
    </radialGradient>
  </defs>

