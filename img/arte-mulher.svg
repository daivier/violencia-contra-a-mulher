<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480">
  <defs>
    <linearGradient id="pele" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6bf9f"/>
      <stop offset="1" stop-color="#eaa483"/>
    </linearGradient>
    <linearGradient id="cabelo" x1="0" y1="0" x2="1" y2="1">
